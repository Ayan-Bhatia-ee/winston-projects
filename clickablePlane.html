<!DOCTYPE html>
<html>
<body>

<img src="https://i.ibb.co/QjkHTgJk/unnamed.png"
     alt="Workplace"
     usemap="#workmap"
     width="629"
     height="407">

<map name="workmap">
  <area shape="rect"
        coords="476,32,512,123"
        id="toggleButton">

  <area shape="poly"
        coords="119,241,160,279,194,271,177,302,173,368,150,299"
        id="toggleButton1">

  <area shape="poly"
        coords="595,201,528,193,416,142,486,137,583,173"
        id="toggleButton2">
        
  <area shape="rect"
        coords="302,250,362,274"
        class="toggleButton3">
        
  <area shape="rect"
        coords="116,181,208,205"
        class="toggleButton3">
  
  <area shape="circle"
        coords="239,347,19"
        class="toggleButton4">

<area shape="circle"
        coords="316,326,19"
        class="toggleButton4">

<area shape="poly"
       coords="424,321,206,264,16,161,119,174,117,182,199,208,211,206,275,224,315,244,297,249,350,274,367,271"
       id="toggleButton5">


      
</map>

<div id="toggledParagraph" hidden> 
<img src="https://i.ibb.co/DfJj4tyY/image.png
" width="200">
  <p>
  This is the paragraph about the Tail control
</p>
</div>

<div id="toggledParagraph1" hidden>
  <img src="https://i.ibb.co/3yv1WVn3/IMG-3015.jpg" width="400">

  <p>This is the paragraph about the propeller
</p> </div>

<div id="toggledParagraph2" hidden>
<img src="https://i.ibb.co/tPBw0YSG/image.png" width="300">

 <p> This is the paragraph about the tail
</p>
   </div>

<div id="toggledParagraph3" hidden>
  <img src="https://i.ibb.co/LXK5NMDT/image.png" width="200">
  <img src="https://i.ibb.co/SDvxCJPC/image.png" width="200">


  <p>This is a paragraph about the aerilon
</p>
</div>
<p id="toggledParagraph4" hidden>
  This is a paragraph about the wheel
</p>

<div id="toggledParagraph5" hidden>
  <img src="https://i.ibb.co/x8ggpqyB/IMG-3014.jpg" width="200">

<p>  This is a paragraph about the wing
</p>
</div>

<script>
    function hideAll(skip){
        if (skip!==0){
            document.getElementById('toggledParagraph').hidden=true;
        }
        if (skip!==1){
            document.getElementById('toggledParagraph1').hidden=true;
        }
        if (skip!==2){
            document.getElementById('toggledParagraph2').hidden=true;
        }
        if (skip!==3){
            document.getElementById('toggledParagraph3').hidden=true;
        }
        if (skip!==4){
            document.getElementById('toggledParagraph4').hidden=true;
        }
        if (skip!==5){    
            document.getElementById('toggledParagraph5').hidden=true;
        }
    }
  document.getElementById('toggleButton').addEventListener('click', e => {
    e.preventDefault();
    hideAll(0);
    document.getElementById('toggledParagraph').toggleAttribute('hidden');
  });

  document.getElementById('toggleButton1').addEventListener('click', e => {
    e.preventDefault();
    hideAll(1);
    document.getElementById('toggledParagraph1').toggleAttribute('hidden');
  });

  document.getElementById('toggleButton2').addEventListener('click', e => {
    e.preventDefault();
    hideAll(2);
    document.getElementById('toggledParagraph2').toggleAttribute('hidden');
  });

  document.querySelectorAll('.toggleButton3').forEach(area => {
    area.addEventListener('click', e => {
      e.preventDefault();
      hideAll(3);
      document
        .getElementById('toggledParagraph3')
        .toggleAttribute('hidden');
    });
  });
  document.querySelectorAll('.toggleButton4').forEach(area => {
    area.addEventListener('click', e => {
      e.preventDefault();
      hideAll(4);
      document
      .getElementById('toggledParagraph4')
      .toggleAttribute('hidden');
    });
  });

document.getElementById('toggleButton5').addEventListener('click', e => {
    e.preventDefault();
    hideAll(5);
    document.getElementById('toggledParagraph5').toggleAttribute('hidden');
  });

</script>


</body>
</html>
